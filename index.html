<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Button</title>

  <style>
    /* ПЛЫВАЮЩАЯ КНОПКА WHATSAPP */
    .whatsapp-float {
      position: fixed;        /* фикс по экрану */
      bottom: 20px;           /* отступ снизу */
      right: 20px;            /* отступ справа */
      width: 56px;
      height: 56px;
      background-color: #25D366;
      color: #fff;
      border-radius: 50%;
      text-align: center;
      line-height: 56px;
      font-size: 28px;
      text-decoration: none;
      z-index: 999999;
      box-shadow: 0 4px 10px rgba(0,0,0,.3);
    }
  </style>
</head>

<body>

  <a href="https://wa.me/77011234567" target="_blank" class="whatsapp-float">
    💬
  </a>

</body>
</html>
